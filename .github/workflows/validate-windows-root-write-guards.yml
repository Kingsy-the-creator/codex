# Proposed validation only. Neither guard restores broad escalation.
name: validate windows root-write guards
on:
  workflow_dispatch:
  push:
    branches: [root-write-guards]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  windows:
    if: github.event.repository.fork == true
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      # Mirrors upstream .github/actions/setup-ci: cargo's git checkout of the
      # rusty_v8 submodule tree exceeds MAX_PATH without core.longpaths, and a
      # short CARGO_HOME keeps every checkout path well under the limit.
      - name: Enable Git long paths and short Cargo paths (Windows)
        shell: pwsh
        run: |
          git config --global core.longpaths true
          "CARGO_HOME=D:\ch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # The hosted runner's default TEMP is C:\Users\runneradmin\..., which Windows
          # also exposes as the 8.3 short name C:\Users\RUNNER~1\...; tests that compare
          # paths textually (deny_read_state, manager_tests) fail on that alone.
          New-Item -ItemType Directory -Force -Path D:\t | Out-Null
          "TMP=D:\t" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=D:\t" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          cache-on-failure: true
      - name: Format check
        run: cargo fmt --check -p codex-windows-sandbox -p codex-sandboxing
      # Upstream's Windows test job builds these two helpers and passes their paths
      # to the tests through CARGO_BIN_EXE_* (rust-ci-full-nextest-platform.yml);
      # `cargo test --lib` does not set them, so unified_exec tests otherwise fail
      # with "failed to launch setup helper: program not found".
      - name: Build Windows sandbox helper binaries (as upstream CI does)
        shell: pwsh
        run: |
          cargo build -p codex-windows-sandbox --bin codex-windows-sandbox-setup --bin codex-command-runner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dbg = Join-Path (Get-Location) 'target\debug'
          "CARGO_BIN_EXE_codex_windows_sandbox_setup=$dbg\codex-windows-sandbox-setup.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_BIN_EXE_codex_command_runner=$dbg\codex-command-runner.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # helper_materialization.rs looks for the runner next to the *test* binary
          # (target\debug\deps\codex_windows_sandbox-<hash>.exe), so place copies there.
          New-Item -ItemType Directory -Force -Path "$dbg\deps" | Out-Null
          Copy-Item "$dbg\codex-windows-sandbox-setup.exe", "$dbg\codex-command-runner.exe" -Destination "$dbg\deps\" -Force
          Get-Item "$dbg\deps\codex-windows-sandbox-setup.exe", "$dbg\deps\codex-command-runner.exe" | Select-Object FullName, Length
      - name: Isolated legacy cancellation test on the patched candidate
        continue-on-error: true
        run: cargo test -p codex-windows-sandbox --lib unified_exec::tests::legacy_capture_cancellation_terminates_descendants_without_timeout -- --exact --nocapture
      - name: Require four named tests, run them, then both unit suites
        run: python ../.github/scripts/validate-root-write-guard-tests.py
      - name: Full Windows sandbox suite, independently of sandboxing suite failure
        if: always()
        run: cargo test -p codex-windows-sandbox --lib
      # Upstream CI runs cargo without --locked at this commit; cargo 1.95 asks to
      # update Cargo.lock here. Show exactly what it changed instead of hiding it.
      - name: Report any Cargo.lock change cargo made
        if: always()
        run: |
          git diff --stat -- Cargo.lock
          git diff -- Cargo.lock | Out-File -FilePath ../windows-ci-cargo-lock.diff -Encoding utf8
      - name: Clippy (separately reported; does not establish unit test success)
        continue-on-error: true
        run: cargo clippy -p codex-windows-sandbox -p codex-sandboxing --tests -- -D warnings
      - name: Compare isolated cancellation and the full Windows suite with unpatched base
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          git -C .. fetch --depth=1 origin c40729ea5cf8e947481b130c59807273eda2f8e9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C .. restore --source=c40729ea5cf8e947481b130c59807273eda2f8e9 -- codex-rs/sandboxing/src/windows.rs codex-rs/sandboxing/src/windows_tests.rs codex-rs/windows-sandbox-rs/src/setup.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Rebuild and re-copy helpers from the restored source as well.
          cargo build -p codex-windows-sandbox --bin codex-windows-sandbox-setup --bin codex-command-runner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dbg = Join-Path (Get-Location) 'target\debug'
          Copy-Item "$dbg\codex-windows-sandbox-setup.exe", "$dbg\codex-command-runner.exe" -Destination "$dbg\deps\" -Force
          cargo test -p codex-windows-sandbox --lib unified_exec::tests::legacy_capture_cancellation_terminates_descendants_without_timeout -- --exact --nocapture
          $cancelExit = $LASTEXITCODE
          cargo test -p codex-windows-sandbox --lib
          $suiteExit = $LASTEXITCODE
          Write-Output "UNPATCHED_BASE_CANCELLATION_EXIT=$cancelExit UNPATCHED_BASE_WINDOWS_SUITE_EXIT=$suiteExit"
          if ($cancelExit -ne 0 -or $suiteExit -ne 0) { exit 1 }
      - name: Preserve complete resolved lockfile and its diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-guard-validation-lockfile
          path: |
            codex-rs/Cargo.lock
            windows-ci-cargo-lock.diff
          retention-days: 7
